name: SignalScope Tests
on:
  push:
    paths:
      - 'projects/signalscope/**'
      - '.github/workflows/signalscope-tests.yml'
  pull_request:
    paths:
      - 'projects/signalscope/**'
      - '.github/workflows/signalscope-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        working-directory: projects/signalscope
        run: python -m py_compile app.py analysis.py generate_demo.py test_analysis.py
      - name: Run SignalScope unit tests
        working-directory: projects/signalscope
        run: python -m unittest discover -s . -p 'test_*.py' -v
