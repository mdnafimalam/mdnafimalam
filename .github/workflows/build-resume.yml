name: Build Resume PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_resume_pdf.py'
      - '.github/workflows/build-resume.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF dependency
        run: python -m pip install reportlab
      - name: Build resume
        run: python scripts/build_resume_pdf.py
      - name: Commit updated resume PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Md_Nafim_Alam_Professional_Resume.pdf
          if git diff --cached --quiet; then
            echo "Resume already current."
          else
            git commit -m "Update professional resume PDF"
            git push
          fi
