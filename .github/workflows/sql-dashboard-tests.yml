name: SQL Dashboard Tests

on:
  push:
    paths:
      - "projects/sql-business-analytics/**"
      - ".github/workflows/sql-dashboard-tests.yml"
  pull_request:
    paths:
      - "projects/sql-business-analytics/**"
      - ".github/workflows/sql-dashboard-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/sql-business-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/sql-business-analytics/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py analytics_core.py generate_data.py test_analytics.py
      - name: Run unit and integration tests
        run: python -m unittest discover -v -p "test_*.py"
