name: Capture SignalScope Preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/capture-signalscope-preview.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture live SignalScope dashboard
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1866, height: 607 },
              deviceScaleFactor: 1
            });

            await page.goto('https://nafim-signalscope.streamlit.app/', {
              waitUntil: 'domcontentloaded',
              timeout: 120000
            });

            await page.waitForTimeout(8000);

            const wakeTexts = [
              'Yes, get this app back up!',
              'Get this app back up',
              'Wake up'
            ];

            for (const text of wakeTexts) {
              const button = page.getByRole('button', { name: new RegExp(text, 'i') });
              if (await button.count()) {
                try {
                  await button.first().click({ timeout: 5000 });
                  await page.waitForTimeout(25000);
                  break;
                } catch (_) {}
              }
            }

            await page.waitForTimeout(8000);

            await page.screenshot({
              path: 'docs/signalscope-preview.png',
              fullPage: false
            });

            await browser.close();
          })();
          NODE

      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/signalscope-preview.png
          if git diff --cached --quiet; then
            echo "Preview unchanged."
          else
            git commit -m "Update SignalScope portfolio preview"
            git push
          fi
